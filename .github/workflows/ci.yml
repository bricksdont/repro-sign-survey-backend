name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff==0.15.22

      - name: Lint (ruff check)
        run: ruff check seed.py export.py scripts/

      - name: Format check (ruff format)
        run: ruff format --check seed.py export.py scripts/

      - name: Syntax check
        run: python3 -m py_compile seed.py export.py scripts/configure_oauth.py

      - name: Validate JSON files
        run: |
          # Glob rather than a hardcoded list, so new seed files are covered automatically.
          for f in seed_data/*.json; do python3 -m json.tool "$f" > /dev/null; done

      - name: JS syntax check
        run: |
          for f in pb_migrations/*.js pb_hooks/*.js; do node --check "$f"; done
