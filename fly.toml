app = 'repro-sign-survey-backend'
org = 'repro-sign'
primary_region = 'fra'

[build]

[mounts]
  source = 'pb_data'
  destination = '/pb/pb_data'
  snapshot_retention = 60

[http_service]
  internal_port = 8090
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  # Keep one machine warm. With 0, Fly stopped the only machine on idle and the
  # next request paid a multi-second cold start — which exceeded the frontend's
  # 10s fetch timeout and surfaced as intermittent "Save failed" in the
  # reviewing form. See issue #51. Do not set this back to 0 while the frontend
  # has a hard client-side timeout on autosave.
  min_machines_running = 1

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
